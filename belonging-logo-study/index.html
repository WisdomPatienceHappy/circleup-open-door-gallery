<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CircleUp logo comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eee9dd;
      color: #103328;
      font: 15px/1.45 system-ui, sans-serif;
    }
    main {
      width: min(1536px, calc(100% - 32px));
      margin: 24px auto 32px;
    }
    h1 {
      margin: 0 0 14px;
      font: 500 clamp(28px, 4vw, 46px)/1.05 Georgia, serif;
      letter-spacing: -.035em;
    }
  </style>
  <link rel="stylesheet" href="picker.css">
  <script defer src="picker.js"></script>
  <link rel="stylesheet" href="../listing-action.css">
</head>
<body>
  <div class="listing-bar"><a class="listing-flyer" href="../flyer-wall/add-listing.html"><span class="listing-flyer-plus" aria-hidden="true">+</span><span>Add your listing!</span></a></div>
  <main class="topic-picker" data-sync-hash>
    <h1>CircleUp in the topic picker</h1>
    <fieldset>
      <legend>Choose a mark to preview beside the original wordmark.</legend>
      <div class="logo-choices"></div>
    </fieldset>
    <figure>
      <img class="picker-reference" src="topic-picker-background-circles.png" width="1536" height="1024" alt="CircleUp topic picker reference, with eight photo topics and a list of selected topics.">
      <svg class="picker-mark" aria-hidden="true" overflow="hidden" hidden>
        <image></image>
      </svg>
    </figure>
  </main>
</body>
</html>
